{% extends 'base.html' %}
{% block page_title %}{% if product.id %}{{ _('แก้ไข') }}{{ _('สินค้า/บริการ') }}{% else %}{{ _('เพิ่ม') }}{{ _('สินค้า/บริการ') }}{% endif %}{% endblock %}
{% block content %}
<form method="post">
<div class="row">
  <div class="col-md-8">
    <div class="card card-outline card-primary"><div class="card-body">
      <div class="row">
        <div class="col-md-4 form-group">
          <label>{{ _('รหัส') }}</label>
          <input class="form-control" name="code" value="{{ product.code or '' }}" placeholder="{{ _('เว้นว่างเพื่อสร้างอัตโนมัติ') }}">
        </div>
        <div class="col-md-8 form-group">
          <label>{{ _('ชื่อ') }} <span class="text-danger">*</span></label>
          <input class="form-control" name="name" value="{{ product.name or '' }}" required autofocus>
        </div>
        <div class="col-12 form-group">
          <label>{{ _('รายละเอียด') }}</label>
          <textarea class="form-control" name="description" rows="3">{{ product.description or '' }}</textarea>
        </div>
        <div class="col-md-3 form-group">
          <label>{{ _('ประเภท') }}</label>
          <select class="form-control" name="product_type">
            <option value="goods"   {% if product.product_type == 'goods'   %}selected{% endif %}>{{ _('สินค้า') }}</option>
            <option value="service" {% if product.product_type == 'service' %}selected{% endif %}>{{ _('บริการ') }}</option>
          </select>
        </div>
        <div class="col-md-3 form-group">
          <label>{{ _('หน่วย') }}</label>
          <input class="form-control" name="unit" value="{{ product.unit or 'ชิ้น' }}">
        </div>
        <div class="col-md-3 form-group">
          <label>{{ _('ราคาขาย') }}</label>
          <input class="form-control text-right" type="number" step="0.01" name="price" value="{{ product.price or 0 }}">
        </div>
        <div class="col-md-3 form-group mb-0">
          <label>{{ _('ต้นทุน') }}</label>
          <input class="form-control text-right" type="number" step="0.01" name="cost" value="{{ product.cost or 0 }}">
        </div>
      </div>
    </div></div>
  </div>
  <div class="col-md-4">
    <div class="card"><div class="card-body">
      <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-save"></i> {{ _('บันทึก') }}</button>
      <a class="btn btn-default btn-block" href="{{ url_for('products.index') }}">{{ _('ยกเลิก') }}</a>
      {% if product.id %}
      <hr>
      <form method="post" action="{{ url_for('products.delete', pid=product.id) }}" onsubmit="return confirm('{{ _('ลบ') }}?');">
        <button class="btn btn-outline-danger btn-block btn-sm"><i class="fas fa-trash"></i> {{ _('ลบ') }}</button>
      </form>
      {% endif %}
    </div></div>
  </div>
</div>
</form>
{% endblock %}
