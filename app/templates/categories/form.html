{% extends 'base.html' %}
{% block page_title %}{% if category.id %}แก้ไขกลุ่ม{% else %}เพิ่มกลุ่ม{% endif %}{% endblock %}
{% block content %}
<form method="post">
<div class="row">
  <div class="col-md-8">
    <div class="card"><div class="card-body">
      <div class="form-group">
        <label>ชื่อกลุ่ม <span class="text-danger">*</span></label>
        <input class="form-control" name="name" value="{{ category.name or '' }}" required autofocus>
      </div>
      <div class="form-group">
        <label>คำอธิบาย</label>
        <textarea class="form-control" name="description" rows="2">{{ category.description or '' }}</textarea>
      </div>
      <div class="form-group mb-0">
        <label>สี</label>
        <input type="color" class="form-control" name="color" value="{{ category.color or '#6366f1' }}" style="width: 80px; height: 38px;">
      </div>
    </div></div>
  </div>
  <div class="col-md-4">
    <div class="card"><div class="card-body">
      <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-save"></i> บันทึก</button>
      <a class="btn btn-default btn-block" href="{{ url_for('categories.index') }}">ยกเลิก</a>
      {% if category.id %}
      <hr>
      <form method="post" action="{{ url_for('categories.delete', cid=category.id) }}" onsubmit="return confirm('ลบ?');">
        <button class="btn btn-outline-danger btn-block btn-sm"><i class="fas fa-trash"></i> ลบกลุ่ม</button>
      </form>
      {% endif %}
    </div></div>
  </div>
</div>
</form>
{% endblock %}
