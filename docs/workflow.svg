<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="500" fill="#f0f9ff"/>

  <text x="600" y="50" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#0c4a6e" text-anchor="middle">📄 Document Workflow</text>
  <text x="600" y="78" font-family="-apple-system, sans-serif" font-size="14" fill="#475569" text-anchor="middle">การแปลงเอกสารตามลำดับการขาย</text>

  <g transform="translate(80,150)">
    <rect width="160" height="180" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="80" cy="42" r="22" fill="#f59e0b"/>
    <text x="80" y="48" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">QT</text>
    <text x="80" y="90" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">ใบเสนอราคา</text>
    <text x="80" y="108" font-family="-apple-system, sans-serif" font-size="11" fill="#92400e" text-anchor="middle">Quotation</text>
    <line x1="20" y1="120" x2="140" y2="120" stroke="#fbbf24" stroke-width="1"/>
    <text x="80" y="138" font-family="-apple-system, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">เสนอราคา</text>
    <text x="80" y="153" font-family="-apple-system, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">ให้ลูกค้า</text>
    <text x="80" y="170" font-family="-apple-system, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">ก่อนตกลง</text>
  </g>

  <g transform="translate(310,150)">
    <rect width="160" height="180" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="80" cy="42" r="22" fill="#3b82f6"/>
    <text x="80" y="48" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">IV</text>
    <text x="80" y="90" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">ใบแจ้งหนี้</text>
    <text x="80" y="108" font-family="-apple-system, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">Invoice</text>
    <line x1="20" y1="120" x2="140" y2="120" stroke="#60a5fa" stroke-width="1"/>
    <text x="80" y="138" font-family="-apple-system, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle">เรียกเก็บเงิน</text>
    <text x="80" y="153" font-family="-apple-system, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle">หลังตกลง</text>
    <text x="80" y="170" font-family="-apple-system, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle">ราคาแล้ว</text>
  </g>

  <g transform="translate(540,150)">
    <rect width="160" height="180" rx="14" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <circle cx="80" cy="42" r="22" fill="#6366f1"/>
    <text x="80" y="48" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">DO</text>
    <text x="80" y="90" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">ใบส่งของ</text>
    <text x="80" y="108" font-family="-apple-system, sans-serif" font-size="11" fill="#3730a3" text-anchor="middle">Delivery Order</text>
    <line x1="20" y1="120" x2="140" y2="120" stroke="#818cf8" stroke-width="1"/>
    <text x="80" y="138" font-family="-apple-system, sans-serif" font-size="10" fill="#312e81" text-anchor="middle">ส่งสินค้า</text>
    <text x="80" y="153" font-family="-apple-system, sans-serif" font-size="10" fill="#312e81" text-anchor="middle">พร้อมเอกสาร</text>
    <text x="80" y="170" font-family="-apple-system, sans-serif" font-size="10" fill="#312e81" text-anchor="middle">ยืนยันการรับ</text>
  </g>

  <g transform="translate(770,150)">
    <rect width="160" height="180" rx="14" fill="#cffafe" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="80" cy="42" r="22" fill="#06b6d4"/>
    <text x="80" y="48" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">TI</text>
    <text x="80" y="90" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#155e75" text-anchor="middle">ใบกำกับภาษี</text>
    <text x="80" y="108" font-family="-apple-system, sans-serif" font-size="11" fill="#155e75" text-anchor="middle">Tax Invoice</text>
    <line x1="20" y1="120" x2="140" y2="120" stroke="#22d3ee" stroke-width="1"/>
    <text x="80" y="138" font-family="-apple-system, sans-serif" font-size="10" fill="#164e63" text-anchor="middle">สำหรับลูกค้า</text>
    <text x="80" y="153" font-family="-apple-system, sans-serif" font-size="10" fill="#164e63" text-anchor="middle">นิติบุคคล</text>
    <text x="80" y="170" font-family="-apple-system, sans-serif" font-size="10" fill="#164e63" text-anchor="middle">ขอ VAT คืน</text>
  </g>

  <g transform="translate(1000,150)">
    <rect width="160" height="180" rx="14" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <circle cx="80" cy="42" r="22" fill="#10b981"/>
    <text x="80" y="48" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">RC</text>
    <text x="80" y="90" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">ใบเสร็จรับเงิน</text>
    <text x="80" y="108" font-family="-apple-system, sans-serif" font-size="11" fill="#065f46" text-anchor="middle">Receipt</text>
    <line x1="20" y1="120" x2="140" y2="120" stroke="#34d399" stroke-width="1"/>
    <text x="80" y="138" font-family="-apple-system, sans-serif" font-size="10" fill="#064e3b" text-anchor="middle">ออกหลัง</text>
    <text x="80" y="153" font-family="-apple-system, sans-serif" font-size="10" fill="#064e3b" text-anchor="middle">รับเงินแล้ว</text>
    <text x="80" y="170" font-family="-apple-system, sans-serif" font-size="10" fill="#064e3b" text-anchor="middle">จากลูกค้า</text>
  </g>

  <g stroke="#0ea5e9" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="240" y1="240" x2="305" y2="240"/>
    <line x1="470" y1="240" x2="535" y2="240"/>
    <line x1="700" y1="240" x2="765" y2="240"/>
    <line x1="930" y1="240" x2="995" y2="240"/>
  </g>

  <g font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#0369a1">
    <text x="272" y="232" text-anchor="middle">ตอบรับ</text>
    <text x="502" y="232" text-anchor="middle">ส่งของ</text>
    <text x="732" y="232" text-anchor="middle">ออกใบ</text>
    <text x="962" y="232" text-anchor="middle">ชำระ</text>
  </g>

  <g transform="translate(80,390)">
    <rect width="1080" height="80" rx="12" fill="#fff" stroke="#bae6fd" stroke-width="1"/>
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#0c4a6e">
      💡 Tip: คลิก "🔄 แปลงเป็น..." ในหน้าดูเอกสาร เพื่อสร้างเอกสารถัดไปโดยใช้ข้อมูลเดิม
    </text>
    <text x="20" y="56" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">
      ระบบจะคัดลอกลูกค้า, รายการสินค้า, ยอดเงินอัตโนมัติ — แค่ตรวจสอบและบันทึกเอกสารใหม่
    </text>
    <text x="20" y="72" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">
      ทุกเอกสารที่เชื่อมโยงกันจะดูได้ในแท็บ "ประวัติ" ของแต่ละเอกสาร
    </text>
  </g>

</svg>
